<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コエミル｜セミナーQ&A集計ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.js"></script>
<style>
  :root{
    --ink:#20261f;
    --ink-soft:#5c6b58;
    --paper:#fffdf6;
    --panel:#ffffff;
    --line:#eae6d6;
    --green:#2f9e64;
    --green-deep:#1f7a4d;
    --gold:#f2a93b;
    --coral:#ef6a52;
    --violet:#7b6ef6;
    --alert:#d1483a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:40px 24px 100px;}

  header.page{position:relative;padding-bottom:24px;margin-bottom:40px;}
  header.page::after{
    content:'';
    position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:4px;
    background:linear-gradient(90deg, var(--green), var(--gold), var(--coral), var(--violet));
  }
  .page-top{display:flex;justify-content:space-between;align-items:center;gap:24px;}
  .brand{display:flex;align-items:center;gap:18px;}
  .logo-mark{width:58px;height:58px;flex-shrink:0;}
  @media (max-width:600px){.logo-mark{width:44px;height:44px;}}

  header.page .eyebrow{
    display:inline-block;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.04em;
    color:#fff;
    background:var(--green);
    padding:4px 12px;
    border-radius:20px;
    margin-bottom:12px;
  }
  header.page h1{font-size:30px;font-weight:900;margin:0 0 8px;color:var(--ink);}
  header.page p{margin:0;color:var(--ink-soft);font-size:14px;max-width:56ch;}

  section{margin-bottom:36px;}
  section h2{
    font-size:16px;
    font-weight:700;
    margin:0 0 16px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  section h2 .badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:28px;height:28px;border-radius:50%;
    font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;
    color:#fff;flex-shrink:0;
  }
  .accent-a h2 .badge{background:var(--green);}
  .accent-b h2 .badge{background:var(--gold);}
  .accent-c h2 .badge{background:var(--coral);}
  .accent-d h2 .badge{background:var(--violet);}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-top:4px solid var(--line);
    border-radius:10px;
    padding:24px;
  }
  .accent-a .panel{border-top-color:var(--green);}
  .accent-b .panel{border-top-color:var(--gold);}
  .accent-c .panel{border-top-color:var(--coral);}
  .accent-d .panel{border-top-color:var(--violet);}

  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
  input[type="text"], input[type="url"], select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    background:#fff;
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
  }
  input:focus, select:focus{outline:2px solid var(--green);outline-offset:1px;}

  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row > .field{flex:1;min-width:220px;}

  button{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    padding:10px 20px;
    border:1px solid var(--green);
    background:var(--green);
    color:#fff;
    border-radius:8px;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  button:hover{background:var(--green-deep);border-color:var(--green-deep);transform:translateY(-1px);}
  button.ghost{background:transparent;color:var(--ink);border-color:var(--line);}
  button.ghost:hover{background:var(--ink);color:#fff;border-color:var(--ink);}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none;}

  .btn-row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap;}

  .checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);}
  .checkline input{width:auto;}

  .status{font-size:13px;margin-top:12px;padding:10px 14px;border-radius:8px;border-left:4px solid var(--green);background:#eaf7f0;display:none;}
  .status.show{display:block;}
  .status.error{border-color:var(--alert);background:#fcece9;color:var(--alert);}
  .status.ok{border-color:var(--green);background:#eaf7f0;color:var(--green-deep);}

  .divider-or{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin:18px 0;
    position:relative;
  }
  .divider-or::before, .divider-or::after{
    content:'';
    position:absolute;top:50%;width:42%;height:1px;background:var(--line);
  }
  .divider-or::before{left:0;}
  .divider-or::after{right:0;}

  .grid-2{display:grid;grid-template-columns:2.2fr 1fr;gap:20px;}
  @media (max-width:760px){.grid-2{grid-template-columns:1fr;}}

  #cloudCanvas{width:100%;height:420px;display:block;background:#fff;border-radius:8px;}
  .cloud-note{font-size:12px;color:var(--ink-soft);margin-top:10px;}

  .cat-list{list-style:none;margin:0;padding:0;}
  .cat-list li{margin-bottom:14px;}
  .cat-btn{
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    font-weight:400;
    color:var(--ink);
  }
  .cat-btn:hover .cat-top span:first-child{color:var(--green-deep);}
  .cat-btn .cat-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
  .cat-btn .cat-count{font-family:'JetBrains Mono',monospace;color:var(--ink-soft);}
  .cat-bar-bg{height:7px;background:var(--line);border-radius:6px;overflow:hidden;}
  .cat-bar-fg{height:7px;border-radius:6px;}

  .qlist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .qlist-head .tag{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    background:var(--violet);
    color:#fff;
    padding:4px 12px;
    border-radius:20px;
  }
  .qitem{
    padding:12px 0;
    border-bottom:1px solid var(--line);
    font-size:14.5px;
  }
  .qitem:last-child{border-bottom:none;}
  .qitem .qmeta{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;}
  .empty-note{color:var(--ink-soft);font-size:13.5px;padding:20px 0;text-align:center;}

  footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-soft);}
  .divider-or{color:var(--ink-soft);}

  /* ---- 投影モード切替ボタン（常時表示） ---- */
  .mode-bar{position:fixed;top:16px;right:16px;z-index:1000;}
  .mode-btn{
    font-size:12.5px;padding:9px 16px;background:#fff;color:var(--ink);
    border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.08);
    border-radius:20px;
  }
  .mode-btn:hover{background:var(--ink);color:#fff;transform:none;}
  body.presentation .mode-btn{opacity:.3;}
  body.presentation .mode-btn:hover{opacity:1;}

  /* ---- 投影モード：会場のスクリーンから見やすい大きな表示に切替 ---- */
  body.presentation{background:#ffffff;}
  body.presentation header.page,
  body.presentation #sourceSection,
  body.presentation #mapSection,
  body.presentation .cloud-note,
  body.presentation footer{display:none !important;}

  body.presentation .wrap{max-width:100%;padding:28px 40px 60px;}

  body.presentation section h2{font-size:22px;margin-bottom:20px;}
  body.presentation section h2 .badge{width:36px;height:36px;font-size:15px;}

  body.presentation .panel{border-top-width:6px;padding:28px;}
  body.presentation .grid-2{grid-template-columns:2.4fr 1fr;gap:28px;}

  body.presentation #cloudCanvas{height:64vh;}

  body.presentation .cat-btn .cat-top{font-size:19px;margin-bottom:8px;}
  body.presentation .cat-bar-bg, body.presentation .cat-bar-fg{height:13px;}
  body.presentation .cat-list li{margin-bottom:22px;}

  body.presentation .qlist-head .tag{font-size:19px;padding:6px 16px;}
  body.presentation #qListBody{max-height:56vh;overflow-y:auto;}
  body.presentation .qitem{font-size:23px;padding:18px 0;}
  body.presentation .qitem .qmeta{font-size:15px;}

  @media (max-width:900px){
    body.presentation .grid-2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="mode-bar">
  <button id="presentModeBtn" class="ghost mode-btn" type="button">投影モードで表示</button>
</div>
<div class="wrap">

  <header class="page">
    <div class="page-top">
      <div class="brand">
        <svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="28" fill="#ffffff" stroke="#1f7a4d" stroke-width="4"/>
          <circle cx="22" cy="26" r="8" fill="#2f9e64"/>
          <circle cx="40" cy="20" r="10" fill="#f2a93b"/>
          <circle cx="46" cy="38" r="7" fill="#ef6a52"/>
          <circle cx="24" cy="42" r="6" fill="#7b6ef6"/>
        </svg>
        <div>
          <div class="eyebrow">SEMINAR Q&A TOOL</div>
          <h1>コエミル</h1>
        </div>
      </div>
    </div>
  </header>

  <section id="sourceSection" class="accent-a">
    <h2><span class="badge">01</span>データソース</h2>
    <div class="panel">
      <div class="field">
        <label for="csvUrl">公開CSVのURL（スプレッドシートを「ウェブに公開」→ CSV 形式で取得したリンク）</label>
        <input type="url" id="csvUrl" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv">
      </div>
      <div class="btn-row">
        <button id="loadBtn">読み込む</button>
        <label class="checkline"><input type="checkbox" id="autoRefresh"> 自動更新</label>
        <select id="refreshInterval" style="width:auto;">
          <option value="30000">30秒ごと</option>
          <option value="60000" selected>60秒ごと</option>
          <option value="300000">5分ごと</option>
        </select>
      </div>

      <div class="divider-or">または</div>

      <div class="field">
        <label for="csvFile">CSVファイルをアップロード（非公開のまま使う場合。自動更新は不可）</label>
        <input type="file" id="csvFile" accept=".csv">
      </div>

      <div id="statusBox" class="status"></div>
    </div>
  </section>

  <section id="mapSection" class="accent-b" style="display:none;">
    <h2><span class="badge">02</span>列の指定</h2>
    <div class="panel">
      <div class="row">
        <div class="field">
          <label for="qCol">質問文の列（必須）</label>
          <select id="qCol"></select>
        </div>
        <div class="field">
          <label for="catCol">カテゴリの列（任意）</label>
          <select id="catCol"></select>
        </div>
      </div>
      <div class="field">
        <label for="excludeWords">除外するキーワード（カンマ区切り・任意）</label>
        <input type="text" id="excludeWords" placeholder="例: 質問, 教えて, ください, セミナー">
      </div>
      <div class="btn-row">
        <button id="aggregateBtn">集計する</button>
      </div>
    </div>
  </section>

  <section id="resultSection" class="accent-c" style="display:none;">
    <h2><span class="badge">03</span>ワードクラウドとカテゴリ</h2>
    <div class="grid-2">
      <div class="panel">
        <canvas id="cloudCanvas"></canvas>
        <p class="cloud-note">単語の色は、最も多く紐づくカテゴリの色（右のカテゴリ一覧と同じ色）を表しています。カテゴリ未指定の場合は出現頻度の濃淡で表示されます。クリックすると、その単語を含む質問を下に一覧表示します。</p>
      </div>
      <div class="panel">
        <ul class="cat-list" id="catList"></ul>
      </div>
    </div>
  </section>

  <section id="listSection" class="accent-d" style="display:none;">
    <h2><span class="badge">04</span>質問一覧</h2>
    <div class="panel">
      <div class="qlist-head">
        <div>絞り込み: <span class="tag" id="filterTag">全件</span></div>
        <button class="ghost" id="clearFilterBtn">全件表示に戻す</button>
      </div>
      <div id="qListBody"></div>
    </div>
  </section>

  <footer>
    データはブラウザ内でのみ処理され、外部には送信されません。集計対象は指定したスプレッドシートの内容のみです。
  </footer>

</div>

<script>
(function(){
  "use strict";

  // ---- デフォルト除外語（頻出しすぎて意味を持たない語） ----
  var DEFAULT_STOPWORDS = [
    "質問","教えて","ください","お願いします","でしょうか","ですか","こんにちは",
    "セミナー","本日","今回","今日","自分","場合","以下","以上","こちら","それ",
    "これ","その他","説明","内容","対応","確認","可能","不可","何か","何が",
    "現在","今後","一つ","二つ","三つ"
  ];

  var state = {
    headers: [],
    rows: [],          // 生データ（オブジェクト配列）
    questions: [],      // {question, category}
    refreshTimer: null,
    dataMode: null       // "url" または "file"
  };

  var els = {};
  ["csvUrl","loadBtn","autoRefresh","refreshInterval","csvFile","statusBox",
   "mapSection","qCol","catCol","excludeWords","aggregateBtn",
   "resultSection","cloudCanvas","catList",
   "listSection","filterTag","qListBody","clearFilterBtn","presentModeBtn"
  ].forEach(function(id){ els[id] = document.getElementById(id); });

  function showStatus(msg, type){
    els.statusBox.textContent = msg;
    els.statusBox.className = "status show " + (type || "");
  }
  function hideStatus(){
    els.statusBox.className = "status";
  }

  // ---------- CSV 読み込み ----------
  function parseAndStore(csvText){
    var parsed = Papa.parse(csvText, { header:true, skipEmptyLines:true });
    if (!parsed.data || !parsed.data.length){
      showStatus("データが読み取れませんでした。CSVの内容を確認してください。", "error");
      return;
    }
    state.headers = parsed.meta.fields || Object.keys(parsed.data[0]);
    state.rows = parsed.data;
    populateColumnSelectors();
    els.mapSection.style.display = "block";
    showStatus(parsed.data.length + " 件の行を読み込みました。列を指定して「集計する」を押してください。", "ok");
  }

  function populateColumnSelectors(){
    var prevQ = els.qCol.value, prevCat = els.catCol.value;
    els.qCol.innerHTML = "";
    els.catCol.innerHTML = '<option value="">（なし）</option>';
    state.headers.forEach(function(h){
      var o1 = document.createElement("option"); o1.value = h; o1.textContent = h;
      els.qCol.appendChild(o1);
      var o2 = document.createElement("option"); o2.value = h; o2.textContent = h;
      els.catCol.appendChild(o2);
    });
    // 質問文らしい列名を自動選択
    var guess = state.headers.find(function(h){ return h.indexOf("質問") !== -1; });
    if (guess) els.qCol.value = guess;
    else if (prevQ && state.headers.indexOf(prevQ) !== -1) els.qCol.value = prevQ;

    var catGuess = state.headers.find(function(h){ return h.indexOf("カテゴリ") !== -1 || h.indexOf("分類") !== -1; });
    if (catGuess) els.catCol.value = catGuess;
    else if (prevCat && state.headers.indexOf(prevCat) !== -1) els.catCol.value = prevCat;
  }

  els.loadBtn.addEventListener("click", function(){
    var url = els.csvUrl.value.trim();
    if (!url){ showStatus("公開CSVのURLを入力してください。", "error"); return; }
    state.dataMode = "url";
    hideStatus();
    showStatus("読み込み中…", "ok");
    fetch(url, { cache: "no-store" })
      .then(function(res){
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(parseAndStore)
      .catch(function(err){
        showStatus("読み込みに失敗しました（" + err.message + "）。スプレッドシートが「ウェブに公開」設定になっているか確認してください。CSVファイルのアップロードもお試しいただけます。", "error");
      });
  });

  els.csvFile.addEventListener("change", function(e){
    var file = e.target.files[0];
    if (!file) return;
    state.dataMode = "file";
    els.autoRefresh.checked = false;
    var reader = new FileReader();
    reader.onload = function(evt){ parseAndStore(evt.target.result); };
    reader.readAsText(file, "UTF-8");
  });

  // ---------- 自動更新 ----------
  els.autoRefresh.addEventListener("change", function(){
    if (state.refreshTimer){ clearInterval(state.refreshTimer); state.refreshTimer = null; }
    if (els.autoRefresh.checked){
      if (state.dataMode !== "url"){
        showStatus("自動更新は公開URLからの読み込み時のみ利用できます。", "error");
        els.autoRefresh.checked = false;
        return;
      }
      var ms = parseInt(els.refreshInterval.value, 10);
      state.refreshTimer = setInterval(function(){
        els.loadBtn.click();
        // 再集計まで自動で行う
        setTimeout(function(){ if (state.rows.length) runAggregate(); }, 800);
      }, ms);
    }
  });
  els.refreshInterval.addEventListener("change", function(){
    if (els.autoRefresh.checked){ els.autoRefresh.checked = false; els.autoRefresh.dispatchEvent(new Event("change")); els.autoRefresh.checked = true; els.autoRefresh.dispatchEvent(new Event("change")); }
  });

  // ---------- キーワード抽出 ----------
  function extractKeywords(text){
    if (!text) return [];
    var patterns = [
      /[\u4E00-\u9FFF]{2,}/g,   // 漢字の連続（2文字以上）
      /[\u30A0-\u30FF]{2,}/g,   // カタカナの連続（2文字以上）
      /[A-Za-z0-9]{2,}/g        // 英数字の連続（2文字以上）
    ];
    var words = [];
    patterns.forEach(function(p){
      var m = text.match(p);
      if (m) words = words.concat(m);
    });
    return words;
  }

  // ---------- 集計 ----------
  function runAggregate(){
    var qCol = els.qCol.value;
    var catCol = els.catCol.value;
    if (!qCol){ showStatus("質問文の列を選択してください。", "error"); return; }

    var exclude = DEFAULT_STOPWORDS.slice();
    var custom = els.excludeWords.value.split(",").map(function(s){return s.trim();}).filter(Boolean);
    exclude = exclude.concat(custom);
    var excludeSet = {};
    exclude.forEach(function(w){ excludeSet[w] = true; });

    var questions = [];
    var freq = {};
    var catCount = {};
    var wordCatCount = {};

    state.rows.forEach(function(row){
      var q = (row[qCol] || "").toString().trim();
      if (!q) return;
      var cat = catCol ? (row[catCol] || "").toString().trim() : "";
      questions.push({ question: q, category: cat });

      if (cat){ catCount[cat] = (catCount[cat] || 0) + 1; }

      var kws = extractKeywords(q);
      var seen = {};
      kws.forEach(function(w){
        if (excludeSet[w]) return;
        if (seen[w]) return; // 同じ質問内での重複は1回に
        seen[w] = true;
        freq[w] = (freq[w] || 0) + 1;
        if (cat){
          wordCatCount[w] = wordCatCount[w] || {};
          wordCatCount[w][cat] = (wordCatCount[w][cat] || 0) + 1;
        }
      });
    });

    // カテゴリごとの色を、件数順に一度だけ確定させる（キーワード側と表示を揃えるため）
    var palette = ["#2f9e64","#f2a93b","#ef6a52","#7b6ef6","#2fa8c9","#d6486b","#1f7a4d"];
    var catRank = Object.keys(catCount).sort(function(a,b){ return catCount[b]-catCount[a]; });
    var categoryColorMap = {};
    catRank.forEach(function(c, idx){ categoryColorMap[c] = palette[idx % palette.length]; });

    state.questions = questions;
    state.freq = freq;
    state.catCount = catCount;
    state.wordCatCount = wordCatCount;
    state.categoryColorMap = categoryColorMap;

    renderWordCloud(freq);
    renderCategoryList(catCount);
    renderQuestionList(null);

    els.resultSection.style.display = "block";
    els.listSection.style.display = "block";
    showStatus(questions.length + " 件の質問を集計しました。", "ok");
  }
  els.aggregateBtn.addEventListener("click", runAggregate);

  // ---------- ワードクラウド描画 ----------
  function renderWordCloud(freq){
    var list = Object.keys(freq).map(function(w){ return [w, freq[w]]; });
    list.sort(function(a,b){ return b[1]-a[1]; });
    list = list.slice(0, 60);

    var canvas = els.cloudCanvas;
    var parentWidth = canvas.parentElement.clientWidth - 44; // panel padding分を差し引き
    canvas.width = Math.max(parentWidth, 300);
    canvas.height = 420;

    if (!list.length){
      var ctx = canvas.getContext("2d");
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "#565f5b";
      ctx.font = "14px sans-serif";
      ctx.fillText("表示できるキーワードがありませんでした。", 16, 30);
      return;
    }

    var maxCount = list[0][1];
    var hasCategoryColors = state.categoryColorMap && Object.keys(state.categoryColorMap).length > 0;

    function dominantCategoryColor(word){
      var byCat = state.wordCatCount ? state.wordCatCount[word] : null;
      if (!byCat) return null;
      var best = null, bestCount = 0;
      Object.keys(byCat).forEach(function(c){
        if (byCat[c] > bestCount){ best = c; bestCount = byCat[c]; }
      });
      return best ? state.categoryColorMap[best] : null;
    }

    WordCloud(canvas, {
      list: list,
      gridSize: Math.round(canvas.width / 90),
      weightFactor: function(size){
        return 12 + (size / maxCount) * 46;
      },
      fontFamily: "'Zen Kaku Gothic New', sans-serif",
      color: function(word, weight){
        if (hasCategoryColors){
          var c = dominantCategoryColor(word);
          if (c) return c;
        }
        // カテゴリ未指定、またはカテゴリに結びつかない語は頻出度の濃淡で表現
        var ratio = weight / maxCount;
        if (ratio > 0.66) return "#1f7a4d";
        if (ratio > 0.33) return "#2f9e64";
        return "#8fc7a4";
      },
      backgroundColor: "#ffffff",
      rotateRatio: 0,
      click: function(item){
        renderQuestionList({ type:"word", value:item[0] });
      }
    });
  }

  // ---------- カテゴリ一覧描画 ----------
  function renderCategoryList(catCount){
    var entries = Object.keys(catCount).map(function(k){ return [k, catCount[k]]; });
    entries.sort(function(a,b){ return b[1]-a[1]; });
    els.catList.innerHTML = "";
    if (!entries.length){
      els.catList.innerHTML = '<li class="empty-note">カテゴリ列が未指定です</li>';
      return;
    }
    var max = entries[0][1];
    var colorMap = state.categoryColorMap || {};
    entries.forEach(function(e){
      var li = document.createElement("li");
      var pct = Math.round((e[1]/max)*100);
      var color = colorMap[e[0]] || "#2f9e64";
      li.innerHTML =
        '<button class="cat-btn" data-cat="'+encodeURIComponent(e[0])+'">' +
          '<div class="cat-top"><span>'+escapeHtml(e[0])+'</span><span class="cat-count">'+e[1]+'</span></div>' +
          '<div class="cat-bar-bg"><div class="cat-bar-fg" style="width:'+pct+'%;background:'+color+'"></div></div>' +
        '</button>';
      els.catList.appendChild(li);
    });
    els.catList.querySelectorAll(".cat-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        renderQuestionList({ type:"category", value: decodeURIComponent(btn.getAttribute("data-cat")) });
      });
    });
  }

  // ---------- 質問一覧描画 ----------
  function renderQuestionList(filter){
    var items = state.questions || [];
    var tag = "全件（" + items.length + "件）";
    if (filter){
      if (filter.type === "word"){
        items = items.filter(function(q){ return q.question.indexOf(filter.value) !== -1; });
        tag = "キーワード「" + filter.value + "」（" + items.length + "件）";
      } else if (filter.type === "category"){
        items = items.filter(function(q){ return q.category === filter.value; });
        tag = "カテゴリ「" + filter.value + "」（" + items.length + "件）";
      }
    }
    els.filterTag.textContent = tag;
    els.qListBody.innerHTML = "";
    if (!items.length){
      els.qListBody.innerHTML = '<div class="empty-note">該当する質問がありません。</div>';
      return;
    }
    items.forEach(function(q){
      var div = document.createElement("div");
      div.className = "qitem";
      var meta = q.category ? escapeHtml(q.category) : "";
      div.innerHTML = (meta ? '<div class="qmeta">' + meta + '</div>' : "") + escapeHtml(q.question);
      els.qListBody.appendChild(div);
    });
  }

  els.clearFilterBtn.addEventListener("click", function(){ renderQuestionList(null); });

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  window.addEventListener("resize", function(){
    if (state.freq) renderWordCloud(state.freq);
  });

  // ---------- 投影モード（会場プロジェクタ表示用） ----------
  var presentationOn = false;
  function setPresentation(on){
    presentationOn = on;
    document.body.classList.toggle("presentation", on);
    els.presentModeBtn.textContent = on ? "編集画面に戻る" : "投影モードで表示";
    // レイアウト変更後にキャンバス幅を再計算
    setTimeout(function(){ if (state.freq) renderWordCloud(state.freq); }, 150);
  }
  els.presentModeBtn.addEventListener("click", function(){
    var goingOn = !presentationOn;
    setPresentation(goingOn);
    if (goingOn){
      var el = document.documentElement;
      if (el.requestFullscreen){ el.requestFullscreen().catch(function(){}); }
    } else if (document.fullscreenElement && document.exitFullscreen){
      document.exitFullscreen().catch(function(){});
    }
  });
  document.addEventListener("fullscreenchange", function(){
    if (!document.fullscreenElement && presentationOn){ setPresentation(false); }
  });

})();
</script>
</body>
</html>
