<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コエミル｜セミナーQ&A集計ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.js"></script>
<style>
  :root{
    --ink:#20261f;
    --ink-soft:#5c6b58;
    --paper:#fffdf6;
    --panel:#ffffff;
    --line:#eae6d6;
    --green:#2f9e64;
    --green-deep:#1f7a4d;
    --gold:#f2a93b;
    --coral:#ef6a52;
    --violet:#7b6ef6;
    --alert:#d1483a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:40px 24px 100px;}

  header.page{position:relative;padding-bottom:24px;margin-bottom:40px;}
  header.page::after{
    content:'';
    position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:4px;
    background:linear-gradient(90deg, var(--green), var(--gold), var(--coral), var(--violet));
  }
  .page-top{display:flex;justify-content:space-between;align-items:center;gap:24px;}
  .brand{display:flex;align-items:center;gap:18px;}
  .logo-mark{width:58px;height:58px;flex-shrink:0;}
  @media (max-width:600px){.logo-mark{width:44px;height:44px;}}

  header.page .eyebrow{
    display:inline-block;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.04em;
    color:#fff;
    background:var(--green);
    padding:4px 12px;
    border-radius:20px;
    margin-bottom:12px;
  }
  header.page h1{font-size:30px;font-weight:900;margin:0 0 8px;color:var(--ink);}
  header.page p{margin:0;color:var(--ink-soft);font-size:14px;max-width:56ch;}

  section{margin-bottom:36px;}
  section h2{
    font-size:16px;
    font-weight:700;
    margin:0 0 16px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  section h2 .badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:28px;height:28px;border-radius:50%;
    font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;
    color:#fff;flex-shrink:0;
  }
  .accent-a h2 .badge{background:var(--green);}
  .accent-b h2 .badge{background:var(--gold);}
  .accent-c h2 .badge{background:var(--coral);}
  .accent-d h2 .badge{background:var(--violet);}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-top:4px solid var(--line);
    border-radius:10px;
    padding:24px;
  }
  .accent-a .panel{border-top-color:var(--green);}
  .accent-b .panel{border-top-color:var(--gold);}
  .accent-c .panel{border-top-color:var(--coral);}
  .accent-d .panel{border-top-color:var(--violet);}

  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
  input[type="text"], input[type="url"], select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    background:#fff;
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
  }
  input:focus, select:focus{outline:2px solid var(--green);outline-offset:1px;}

  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row > .field{flex:1;min-width:220px;}

  button{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    padding:10px 20px;
    border:1px solid var(--green);
    background:var(--green);
    color:#fff;
    border-radius:8px;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  button:hover{background:var(--green-deep);border-color:var(--green-deep);transform:translateY(-1px);}
  button.ghost{background:transparent;color:var(--ink);border-color:var(--line);}
  button.ghost:hover{background:var(--ink);color:#fff;border-color:var(--ink);}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none;}

  .btn-row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap;}

  .checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);}
  .checkline input{width:auto;}

  .status{font-size:13px;margin-top:12px;padding:10px 14px;border-radius:8px;border-left:4px solid var(--green);background:#eaf7f0;display:none;}
  .status.show{display:block;}
  .status.error{border-color:var(--alert);background:#fcece9;color:var(--alert);}
  .status.ok{border-color:var(--green);background:#eaf7f0;color:var(--green-deep);}

  .divider-or{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin:18px 0;
    position:relative;
  }
  .divider-or::before, .divider-or::after{
    content:'';
    position:absolute;top:50%;width:42%;height:1px;background:var(--line);
  }
  .divider-or::before{left:0;}
  .divider-or::after{right:0;}

  .grid-2{display:grid;grid-template-columns:2.2fr 1fr;gap:20px;}
  @media (max-width:760px){.grid-2{grid-template-columns:1fr;}}

  #cloudCanvas{width:100%;height:420px;display:block;background:#fff;border-radius:8px;}
  .cloud-note{font-size:12px;color:var(--ink-soft);margin-top:10px;}

  .cat-list{list-style:none;margin:0;padding:0;}
  .cat-list li{margin-bottom:14px;}
  .cat-btn{
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    font-weight:400;
    color:var(--ink);
  }
  .cat-btn:hover .cat-top span:first-child{color:var(--green-deep);}
  .cat-btn .cat-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
  .cat-btn .cat-count{font-family:'JetBrains Mono',monospace;color:var(--ink-soft);}
  .cat-bar-bg{height:7px;background:var(--line);border-radius:6px;overflow:hidden;}
  .cat-bar-fg{height:7px;border-radius:6px;}

  .qlist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .qlist-head .tag{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    background:var(--violet);
    color:#fff;
    padding:4px 12px;
    border-radius:20px;
  }
  .qitem{
    padding:12px 0;
    border-bottom:1px solid var(--line);
    font-size:14.5px;
  }
  .qitem:last-child{border-bottom:none;}
  .qitem .qmeta{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;}
  .empty-note{color:var(--ink-soft);font-size:13.5px;padding:20px 0;text-align:center;}

  footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-soft);}
  .divider-or{color:var(--ink-soft);}

  /* ---- データソース固定モード（config.json の lockDataSource: true） ----
     URL入力・読み込みボタン・CSVアップロードを隠し、config.json の csvUrl だけを使う */
  .lock-note{
    display:none;margin:0;padding:10px 14px;border-radius:8px;
    background:#f6f2e2;border-left:4px solid var(--gold);
    color:var(--ink-soft);font-size:13px;
  }
  body.source-locked .lock-note{display:block;}
  body.source-locked .src-input{display:none !important;}

  /* ---- 投影モード切替ボタン（常時表示） ---- */
  .mode-bar{position:fixed;top:16px;right:16px;z-index:1000;}
  .mode-btn{
    font-size:12.5px;padding:9px 16px;background:#fff;color:var(--ink);
    border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.08);
    border-radius:20px;
  }
  .mode-btn:hover{background:var(--ink);color:#fff;transform:none;}
  body.presentation .mode-btn{opacity:.3;}
  body.presentation .mode-btn:hover{opacity:1;}
  body.presentation .mode-bar{top:auto;bottom:16px;}  /* 上部バーと重ならないよう右下へ */

  /* ---- 投影モード：会場のスクリーンから見やすい大きな表示に切替 ---- */
  /* カテゴリ一覧・質問一覧・各種設定を隠し、ワードクラウドだけを画面いっぱいに表示する */
  body.presentation{background:#ffffff;overflow:hidden;}
  body.presentation header.page,
  body.presentation #sourceSection,
  body.presentation #mapSection,
  body.presentation #listSection,
  body.presentation #resultSection > h2,
  body.presentation .cat-panel,
  body.presentation .cloud-note,
  body.presentation footer{display:none !important;}

  body.presentation .wrap{max-width:100%;padding:0;}
  body.presentation #resultSection{margin:62px 0 0;height:calc(100vh - 62px);}
  body.presentation .grid-2{display:block;height:100%;}
  body.presentation .cloud-panel{
    height:100%;border:0;border-radius:0;padding:12px;
  }
  body.presentation #cloudCanvas{border-radius:0;}

  /* ---- 投影モード上部バー：セミナー名・登壇者・質問数 ---- */
  .pres-bar{display:none;}
  body.presentation .pres-bar{
    display:flex;position:fixed;left:0;right:0;top:0;height:62px;z-index:10;
    align-items:center;gap:14px;padding:0 24px;background:#fff;
    border-top:6px solid var(--coral);border-bottom:1px solid var(--line);
  }
  .pb-event{font-size:18px;font-weight:700;line-height:1.25;color:var(--ink);min-width:0;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;}  /* 長いときは2行まで折り返す */
  .pb-event:empty{display:none;}
  .pb-part{display:inline-block;}
  .pb-count{margin-left:auto;flex-shrink:0;font-size:18px;font-weight:700;color:var(--ink-soft);}
  .event-line{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .event-line:empty{display:none;}

  /* ---- 質問が追加されたときの演出：増えた単語を光らせ、ぽんと大きく見せる ---- */
  .cloud-panel{position:relative;}
  .fx-layer{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:5;}
  .fx-hl{
    position:absolute;border-radius:14px;background:rgba(255,200,0,.5);mix-blend-mode:multiply;
    box-shadow:0 0 22px 6px rgba(255,190,0,.65);
    animation:fxGlow 1.8s ease-in-out infinite alternate;      /* 次の更新まで光り続ける */
  }
  @keyframes fxGlow{0%{opacity:.45}100%{opacity:1}}
  .fx-pop{position:absolute;mix-blend-mode:multiply;transform-origin:center;animation:fxPop .9s cubic-bezier(.2,.8,.3,1.3) 1 forwards;}
  @keyframes fxPop{0%{transform:scale(1);opacity:1}35%{transform:scale(1.5)}100%{transform:scale(1);opacity:0}}
  @media (prefers-reduced-motion:reduce){ .fx-pop{display:none;} .fx-hl{animation:none;} }

  /* ---- キーワードをクリックしたときのポップアップ ---- */
  .kw-modal{
    position:fixed;inset:0;z-index:2000;display:none;
    align-items:center;justify-content:center;
    background:rgba(32,38,31,.55);padding:24px;cursor:pointer;
  }
  .kw-modal.show{display:flex;}
  .kw-card{
    background:#fff;border-radius:16px;border-top:8px solid var(--green);
    box-shadow:0 20px 60px rgba(0,0,0,.35);
    width:min(1100px,94vw);max-height:90vh;
    display:flex;flex-direction:column;cursor:default;
  }
  .kw-head{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:18px 26px 12px;border-bottom:1px solid var(--line);flex-shrink:0;
  }
  .kw-title{font-size:26px;font-weight:900;}
  .kw-title .kw-word{color:var(--kw-color,var(--green-deep));}
  .kw-title .kw-count{
    font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500;
    color:var(--ink-soft);margin-left:12px;
  }
  .kw-close{padding:6px 14px;font-size:20px;line-height:1;border-radius:20px;}
  .kw-body{padding:6px 26px 18px;overflow-y:auto;column-gap:40px;}
  .kw-item{
    font-size:var(--kw-fs,17px);line-height:1.5;
    padding:.55em 0;border-bottom:1px solid var(--line);
    break-inside:avoid;
  }
  .kw-item:last-child{border-bottom:none;}
  .kw-item .qmeta{
    font-family:'JetBrains Mono',monospace;font-size:11.5px;
    color:var(--ink-soft);margin-bottom:2px;
  }
  .kw-item mark{
    background:linear-gradient(transparent 55%, rgba(242,169,59,.55) 55%);
    color:inherit;font-weight:700;
  }
  body.presentation .kw-title{font-size:clamp(26px,2.6vw,48px);}
  body.presentation .kw-title .kw-count{font-size:clamp(15px,1.4vw,26px);}
  body.presentation .kw-item .qmeta{display:none;}
</style>
</head>
<body>
<div class="mode-bar">
  <button id="presentModeBtn" class="ghost mode-btn" type="button">投影モードで表示</button>
</div>
<div class="wrap">

  <header class="page">
    <div class="page-top">
      <div class="brand">
        <svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="28" fill="#ffffff" stroke="#1f7a4d" stroke-width="4"/>
          <circle cx="22" cy="26" r="8" fill="#2f9e64"/>
          <circle cx="40" cy="20" r="10" fill="#f2a93b"/>
          <circle cx="46" cy="38" r="7" fill="#ef6a52"/>
          <circle cx="24" cy="42" r="6" fill="#7b6ef6"/>
        </svg>
        <div>
          <div class="eyebrow">SEMINAR Q&A TOOL</div>
          <h1>コエミル</h1>
          <div class="event-line" id="eventLine"></div>
        </div>
      </div>
    </div>
  </header>

  <section id="sourceSection" class="accent-a">
    <h2><span class="badge">01</span>データソース</h2>
    <div class="panel">
      <p class="lock-note" id="lockNote">データソースは config.json で固定されています（この画面では変更できません）。</p>
      <div class="field src-input">
        <label for="csvUrl">公開CSVのURL（スプレッドシートを「ウェブに公開」→ CSV 形式で取得したリンク）</label>
        <input type="url" id="csvUrl" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv">
      </div>
      <div class="btn-row">
        <button id="loadBtn" class="src-input">読み込む</button>
        <label class="checkline"><input type="checkbox" id="autoRefresh"> 自動更新</label>
        <select id="refreshInterval" style="width:auto;">
          <option value="5000">5秒ごと（テスト用）</option>
          <option value="15000">15秒ごと（テスト用）</option>
          <option value="30000">30秒ごと</option>
          <option value="60000" selected>60秒ごと</option>
          <option value="300000">5分ごと</option>
        </select>
      </div>

      <div class="divider-or src-input">または</div>

      <div class="field src-input">
        <label for="csvFile">CSVファイルをアップロード（非公開のまま使う場合。自動更新は不可）</label>
        <input type="file" id="csvFile" accept=".csv">
      </div>

      <div id="statusBox" class="status"></div>
    </div>
  </section>

  <section id="mapSection" class="accent-b" style="display:none;">
    <h2><span class="badge">02</span>列の指定</h2>
    <div class="panel">
      <div class="row">
        <div class="field">
          <label for="qCol">質問文の列（必須）</label>
          <select id="qCol"></select>
        </div>
        <div class="field">
          <label for="catCol">カテゴリの列（任意）</label>
          <select id="catCol"></select>
        </div>
      </div>
      <div class="field">
        <label for="excludeWords">除外するキーワード（カンマ区切り・任意）</label>
        <input type="text" id="excludeWords" placeholder="例: 質問, 教えて, ください, セミナー">
      </div>
      <div class="btn-row">
        <button id="aggregateBtn">集計する</button>
      </div>
    </div>
  </section>

  <section id="resultSection" class="accent-c" style="display:none;">
    <h2><span class="badge">03</span>ワードクラウドとカテゴリ</h2>
    <div class="grid-2">
      <div class="panel cloud-panel">
        <canvas id="cloudCanvas"></canvas>
        <p class="cloud-note">単語の色は、最も多く紐づくカテゴリの色（右のカテゴリ一覧と同じ色）を表しています。カテゴリ未指定の場合は出現頻度の濃淡で表示されます。クリックすると、その単語を含む質問がポップアップで表示されます。</p>
      </div>
      <div class="panel cat-panel">
        <ul class="cat-list" id="catList"></ul>
      </div>
    </div>
  </section>

  <section id="listSection" class="accent-d" style="display:none;">
    <h2><span class="badge">04</span>質問一覧</h2>
    <div class="panel">
      <div class="qlist-head">
        <div>絞り込み: <span class="tag" id="filterTag">全件</span></div>
        <button class="ghost" id="clearFilterBtn">全件表示に戻す</button>
      </div>
      <div id="qListBody"></div>
    </div>
  </section>

  <footer>
    データはブラウザ内でのみ処理され、外部には送信されません。集計対象は指定したスプレッドシートの内容のみです。
  </footer>

</div>

<div class="pres-bar" id="presBar">
    <span class="pb-event" id="pbEvent"></span>
    <span class="pb-count" id="pbCount"></span>
</div>

<div class="kw-modal" id="kwModal" role="dialog" aria-modal="true" aria-labelledby="kwTitle">
  <div class="kw-card" id="kwCard">
    <div class="kw-head">
      <div class="kw-title" id="kwTitle"></div>
      <button type="button" class="ghost kw-close" id="kwClose" aria-label="閉じる">×</button>
    </div>
    <div class="kw-body" id="kwBody"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---- デフォルト除外語（頻出しすぎて意味を持たない語） ----
  var DEFAULT_STOPWORDS = [
    "質問","教えて","ください","お願いします","でしょうか","ですか","こんにちは",
    "セミナー","本日","今回","今日","自分","場合","以下","以上","こちら","それ",
    "これ","その他","説明","内容","対応","確認","可能","不可","何か","何が",
    "現在","今後","一つ","二つ","三つ",
    // 形態素解析では名詞として拾われるが、質問の話題にはならない語
    "具体","程度","見込み","見通し","取り組み","可能性","考え","状況"
  ];

  // ---- 形態素解析（Kuromoji.js） ----
  // 辞書（約18MB）はCDNから読み込む。ブラウザにキャッシュされるため、2回目以降は速い。
  var KUROMOJI_DICT_PATH = "https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/";
  // 名詞につなげない接尾辞（「効果的」「大雪時」ではなく「効果」「大雪」を残す）
  var SUFFIX_NO_MERGE = ["的","時","後","前","中","等","毎","様","風","以外","以上","以下","以内","ごと","向け","向き","ずつ"];
  // 次の名詞につなげる接頭辞（新＋千歳空港 → 新千歳空港）
  var PREFIX_MERGE = ["新","旧","脱","全","総","超","準","元"];

  var state = {
    tokenizer: null,          // 形態素解析器（読み込み完了後にセットされる）
    tokenizerStatus: "loading", // "loading" | "ready" | "failed"
    aggregated: false,        // 一度でも集計したか
    headers: [],
    rows: [],          // 生データ（オブジェクト配列）
    questions: [],      // {question, category}
    refreshTimer: null,
    refreshing: false,   // 自動更新の通信中フラグ（重複実行を防ぐ）
    refreshFailed: false, // 直前の自動更新が通信エラーだったか
    sourceLocked: false,  // config.json の lockDataSource が true（画面からデータソースを変更できない）
    lastCsvText: null,   // 前回取得したCSVの中身（自動更新で変化を検知するために使う）
    dataMode: null       // "url" または "file"
  };

  var els = {};
  ["csvUrl","loadBtn","autoRefresh","refreshInterval","csvFile","statusBox",
   "mapSection","qCol","catCol","excludeWords","aggregateBtn",
   "resultSection","cloudCanvas","catList",
   "listSection","filterTag","qListBody","clearFilterBtn","presentModeBtn",
   "kwModal","kwCard","kwTitle","kwBody","kwClose","pbEvent","pbCount","eventLine"
  ].forEach(function(id){ els[id] = document.getElementById(id); });

  function showStatus(msg, type){
    els.statusBox.textContent = msg;
    els.statusBox.className = "status show " + (type || "");
  }
  function hideStatus(){
    els.statusBox.className = "status";
  }

  // ---------- CSV 読み込み ----------
  function parseAndStore(csvText){
    var parsed = Papa.parse(csvText, { header:true, skipEmptyLines:true });
    if (!parsed.data || !parsed.data.length){
      showStatus("データが読み取れませんでした。CSVの内容を確認してください。", "error");
      return false;
    }
    state.headers = parsed.meta.fields || Object.keys(parsed.data[0]);
    state.rows = parsed.data;
    populateColumnSelectors();
    els.mapSection.style.display = "block";
    showStatus(parsed.data.length + " 件の行を読み込みました。列を指定して「集計する」を押してください。", "ok");
    return true;
  }

  function populateColumnSelectors(){
    // 2回目以降の読み込み（自動更新を含む）かどうか。その場合は、選択済みの列を維持する
    var hadColumns = els.qCol.options.length > 0;
    var prevQ = els.qCol.value, prevCat = els.catCol.value;
    els.qCol.innerHTML = "";
    els.catCol.innerHTML = '<option value="">（なし）</option>';
    state.headers.forEach(function(h){
      var o1 = document.createElement("option"); o1.value = h; o1.textContent = h;
      els.qCol.appendChild(o1);
      var o2 = document.createElement("option"); o2.value = h; o2.textContent = h;
      els.catCol.appendChild(o2);
    });

    // 質問文の列：前回の選択が残っていればそれを優先。なければ「質問」を含む列名を自動選択
    if (hadColumns && state.headers.indexOf(prevQ) !== -1){
      els.qCol.value = prevQ;
    } else {
      var guess = state.headers.find(function(h){ return h.indexOf("質問") !== -1; });
      if (guess) els.qCol.value = guess;
    }

    // カテゴリの列：同様。「（なし）」を選んでいた場合もそのまま維持する
    if (hadColumns && (prevCat === "" || state.headers.indexOf(prevCat) !== -1)){
      els.catCol.value = prevCat;
    } else {
      var catGuess = state.headers.find(function(h){ return h.indexOf("カテゴリ") !== -1 || h.indexOf("分類") !== -1; });
      if (catGuess) els.catCol.value = catGuess;
    }
  }

  function loadFromUrl(url){
    state.dataMode = "url";
    hideStatus();
    showStatus("読み込み中…", "ok");
    return fetch(url, { cache: "no-store" })
      .then(function(res){
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function(text){
        state.lastCsvText = text;   // 自動更新で「前回から変化したか」を比べる基準にする
        parseAndStore(text);
      })
      .catch(function(err){
        var hint = state.sourceLocked
          ? "config.json の csvUrl と、スプレッドシートの「ウェブに公開」設定を確認してください。"
          : "スプレッドシートが「ウェブに公開」設定になっているか確認してください。CSVファイルのアップロードもお試しいただけます。";
        showStatus("読み込みに失敗しました（" + err.message + "）。" + hint, "error");
        throw err;
      });
  }

  els.loadBtn.addEventListener("click", function(){
    if (state.sourceLocked) return;   // データソース固定中は、画面からの読み込みは受け付けない
    var url = els.csvUrl.value.trim();
    if (!url){ showStatus("公開CSVのURLを入力してください。", "error"); return; }
    loadFromUrl(url).catch(function(){ /* エラー表示は loadFromUrl 内で行い済み */ });
  });

  els.csvFile.addEventListener("change", function(e){
    if (state.sourceLocked) return;   // データソース固定中は、CSVアップロードも受け付けない
    var file = e.target.files[0];
    if (!file) return;
    state.dataMode = "file";
    state.lastCsvText = null;
    els.autoRefresh.checked = false;
    var reader = new FileReader();
    reader.onload = function(evt){ parseAndStore(evt.target.result); };
    reader.readAsText(file, "UTF-8");
  });

  // ---------- 自動更新 ----------
  els.autoRefresh.addEventListener("change", function(){
    if (state.refreshTimer){ clearInterval(state.refreshTimer); state.refreshTimer = null; }
    if (els.autoRefresh.checked){
      if (state.dataMode !== "url"){
        showStatus("自動更新は公開URLからの読み込み時のみ利用できます。", "error");
        els.autoRefresh.checked = false;
        return;
      }
      var ms = parseInt(els.refreshInterval.value, 10);
      state.refreshTimer = setInterval(refreshIfChanged, ms);
    }
  });

  // 一定間隔でCSVを取得し、前回から内容が変わっていたときだけ再集計・再描画する。
  // 変化がなければ何もしない（ワードクラウドの配置も、開いているポップアップもそのまま）。
  // 追加だけでなく、修正・削除があった場合も反映する。
  function refreshIfChanged(){
    var url = els.csvUrl.value.trim();
    if (!url || state.refreshing) return;
    state.refreshing = true;
    fetch(url, { cache: "no-store" })
      .then(function(res){
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function(text){
        if (text === state.lastCsvText){              // 変化なし
          if (state.refreshFailed){                   // 通信エラーから復旧したときだけ表示を戻す
            state.refreshFailed = false;
            showStatus("自動更新が復旧しました（合計 " + state.questions.length + " 件・変更なし）", "ok");
          }
          return;
        }
        state.refreshFailed = false;
        var before = state.questions.length;
        state.lastCsvText = text;
        if (!parseAndStore(text)) return;             // 読み取れないデータなら、表示は前回のまま
        state.highlightNext = true;                   // 自動更新で増えた単語だけ演出する（最初の表示・辞書の切替では演出しない）
        runAggregate();
        var added = state.questions.length - before;
        showStatus(
          (added > 0 ? "新しい質問が " + added + " 件追加されました" : "データが更新されました") +
          "（合計 " + state.questions.length + " 件）", "ok");
      })
      .catch(function(err){
        // 通信エラーのときは表示を変えず、次回の更新で再試行する
        state.refreshFailed = true;
        showStatus("自動更新に失敗しました（" + err.message + "）。次回の更新で再試行します。", "error");
      })
      .then(function(){ state.refreshing = false; });
  }
  els.refreshInterval.addEventListener("change", function(){
    if (els.autoRefresh.checked){ els.autoRefresh.checked = false; els.autoRefresh.dispatchEvent(new Event("change")); els.autoRefresh.checked = true; els.autoRefresh.dispatchEvent(new Event("change")); }
  });

  // ---------- キーワード抽出 ----------
  // 質問文から単語を取り出す。辞書の読み込みが済んでいれば形態素解析、そうでなければ簡易抽出。
  function extractKeywords(text){
    if (!text) return [];
    var toks = state.tokenizer ? state.tokenizer.tokenize(text) : null;   // 別スレッドで解析済みの結果（まだなら null）
    return toks ? extractByMorphology(toks) : extractBySimplePattern(text);
  }

  // 簡易抽出：漢字・カタカナ・英数字の連続を単語とみなす（辞書が使えないときの代替）
  function extractBySimplePattern(text){
    var patterns = [
      /[一-鿿]{2,}/g,   // 漢字の連続（2文字以上）
      /[゠-ヿ]{2,}/g,   // カタカナの連続（2文字以上）
      /[A-Za-z0-9]{2,}/g        // 英数字の連続（2文字以上）
    ];
    var words = [];
    patterns.forEach(function(p){
      var m = text.match(p);
      if (m) words = words.concat(m);
    });
    return words;
  }

  // 形態素解析：名詞だけを取り出し、「駐車＋場」「新＋千歳空港」のような部品をつなげて1語にする
  function isKatakanaWord(s){ return /^[゠-ヿ]+$/.test(s); }

  function classifyToken(t){
    var s = t.surface_form;
    if (t.pos === "接頭詞"){
      return (t.pos_detail_1 === "名詞接続" && PREFIX_MERGE.indexOf(s) !== -1) ? "prefix" : "other";
    }
    if (t.pos !== "名詞") return "other";
    var d = t.pos_detail_1;
    if (d === "一般" || d === "固有名詞" || d === "サ変接続") return "stem";  // 単独で単語になれる名詞
    if (d === "形容動詞語幹") return "weakstem";                               // 接尾辞がつくときだけ単語にする（重要性など）
    if (d === "接尾") return SUFFIX_NO_MERGE.indexOf(s) === -1 ? "suffix" : "break";
    return "other";   // 数・代名詞・非自立（よう・ため）・副詞可能（今後・多く）など
  }

  function extractByMorphology(tokens){
    var words = [];
    var cur = null;   // 組み立て中の語 { text, ok: 単語として使えるか, kata: カタカナのみか, needStem: 接頭辞だけで次の語待ちか }

    function flush(){
      if (cur && cur.ok && cur.text.length >= 2) words.push(cur.text);   // 1文字の語は捨てる
      cur = null;
    }

    tokens.forEach(function(t){
      var s = t.surface_form, kind = classifyToken(t);

      if (kind === "prefix"){ flush(); cur = { text: s, ok: false, kata: false, needStem: true }; return; }

      if (kind === "stem" || kind === "weakstem"){
        var strong = (kind === "stem"), kata = isKatakanaWord(s);
        if (cur && cur.needStem){                              // 接頭辞のあとの語：新＋千歳空港
          cur.text += s; cur.needStem = false; cur.ok = strong; cur.kata = kata; return;
        }
        if (cur && strong && cur.kata && kata){                // カタカナの連続：イン＋バウンド → インバウンド
          cur.text += s; return;
        }
        flush();
        cur = { text: s, ok: strong, kata: kata, needStem: false };
        return;
      }

      if (kind === "suffix"){
        if (cur && !cur.needStem){ cur.text += s; cur.ok = true; cur.kata = false; }   // 駐車＋場 → 駐車場
        else { flush(); }
        return;
      }

      flush();   // 助詞・動詞・記号・数などで語は途切れる（「的」「時」などもここで途切れる）
    });
    flush();
    return words;
  }

  // ---------- 辞書（Kuromoji）の読み込み ----------
  var tokenizerReady = null;   // 辞書の読み込みが終わったら（成功・失敗を問わず）解決するPromise

  function extractModeLabel(){
    if (state.tokenizerStatus === "ready") return "（形態素解析で抽出）";
    if (state.tokenizerStatus === "off") return "（簡易抽出）";
    if (state.tokenizerStatus === "loading") return "（辞書を読み込み中のため簡易抽出。読み込み後に自動で切り替わります）";
    return "（辞書を読み込めなかったため簡易抽出）";
  }

  function initTokenizer(){
    var resolveReady;
    tokenizerReady = new Promise(function(r){ resolveReady = r; });

    function failed(){
      state.tokenizerStatus = "failed";
      resolveReady();
      // 集計済みの画面は簡易抽出のまま変わらないので、状態表示だけ更新する
      if (state.aggregated){ showStatus(state.questions.length + " 件の質問を集計しました" + extractModeLabel() + "。", "ok"); }
    }

    // 辞書の展開は重く、そのまま実行すると画面全体が固まるため、別スレッド（Web Worker）で行う。
    // 画面側は、解析済みの結果をもらって使うだけ（解析待ちの質問は、その間だけ簡易抽出になる）。
    var tokCache = Object.create(null);
    var queue = [], queued = Object.create(null), flushTimer = null, rerunTimer = null, worker = null;

    var workerSrc =
      "var tk=null;" +
      "onmessage=function(e){var m=e.data;" +
      " if(m.type==='init'){try{importScripts(m.script);" +
      "  kuromoji.builder({dicPath:m.dict}).build(function(err,t){" +
      "   if(err||!t){postMessage({type:'failed'});return;} tk=t; postMessage({type:'ready'});});" +
      " }catch(x){postMessage({type:'failed'});}}" +
      " else if(m.type==='tokenize'&&tk){var out=m.texts.map(function(t){" +
      "  return tk.tokenize(t).map(function(o){return {surface_form:o.surface_form,pos:o.pos,pos_detail_1:o.pos_detail_1};});});" +
      "  postMessage({type:'tokens',texts:m.texts,result:out});}" +
      "};";

    function absUrl(u){ return new URL(u, location.href).href; }

    function requestTokens(text){
      if (queued[text]) return;
      queued[text] = true; queue.push(text);
      if (!flushTimer){
        flushTimer = setTimeout(function(){
          flushTimer = null;
          var texts = queue; queue = [];
          worker.postMessage({ type: "tokenize", texts: texts });
        }, 0);
      }
    }

    try {
      worker = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: "text/javascript" })));
    } catch (e){ failed(); return; }

    worker.onerror = function(){ if (state.tokenizerStatus === "loading"){ failed(); } };
    worker.onmessage = function(ev){
      var m = ev.data;
      if (m.type === "failed"){ failed(); return; }
      if (m.type === "ready"){
        state.tokenizer = { tokenize: function(text){
          var t = tokCache[text];
          if (!t){ requestTokens(text); return null; }
          return t;
        } };
        state.tokenizerStatus = "ready";
        resolveReady();
        if (state.aggregated){ runAggregate(); }   // 簡易抽出で集計済みなら、解析結果で集計し直す
        return;
      }
      if (m.type === "tokens"){
        m.texts.forEach(function(t, i){ tokCache[t] = m.result[i]; });
        if (state.aggregated){
          clearTimeout(rerunTimer);
          rerunTimer = setTimeout(runAggregate, 30);   // 結果がまとめて届くので、1回だけ描き直す
        }
      }
    };
    // 一定時間たっても辞書の準備ができない場合（対応していないブラウザ・遅い回線など）は、簡易抽出のままにする
    setTimeout(function(){ if (state.tokenizerStatus === "loading"){ failed(); } }, 60000);
    worker.postMessage({
      type: "init",
      script: absUrl("https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js"),
      dict: absUrl(KUROMOJI_DICT_PATH)
    });
  }

  // 辞書の読み込みを待つ（最大 ms ミリ秒。間に合わなければ簡易抽出で先に進み、読み込み後に自動で切り替える）
  function waitForTokenizer(ms){
    return Promise.race([tokenizerReady, new Promise(function(r){ setTimeout(r, ms); })]);
  }

  // 単語を含む質問の一覧（ワードクラウドの大きさと同じ基準で数える）
  function questionsForWord(word){
    var idx = state.wordQuestions ? state.wordQuestions[word] : null;
    if (!idx) return [];
    return idx.map(function(i){ return state.questions[i]; });
  }

  // ---------- 集計 ----------
  function runAggregate(){
    var qCol = els.qCol.value;
    var catCol = els.catCol.value;
    if (!qCol){ showStatus("質問文の列を選択してください。", "error"); return; }

    var exclude = DEFAULT_STOPWORDS.slice();
    var custom = els.excludeWords.value.split(",").map(function(s){return s.trim();}).filter(Boolean);
    exclude = exclude.concat(custom);
    var excludeSet = Object.create(null);
    exclude.forEach(function(w){ excludeSet[w] = true; });

    var questions = [];
    // 単語をキーにするので、"constructor" などの名前でも壊れないよう、プロトタイプのない入れ物を使う
    var freq = Object.create(null);
    var wordQuestions = Object.create(null);   // 単語 → その単語を含む質問の番号（ポップアップ・一覧の絞り込み用）
    var catCount = {};
    var wordCatCount = Object.create(null);

    state.rows.forEach(function(row){
      var q = (row[qCol] || "").toString().trim();
      if (!q) return;
      var cat = catCol ? (row[catCol] || "").toString().trim() : "";
      questions.push({ question: q, category: cat });
      var qIndex = questions.length - 1;

      if (cat){ catCount[cat] = (catCount[cat] || 0) + 1; }

      var kws = extractKeywords(q);
      var seen = Object.create(null);
      kws.forEach(function(w){
        if (excludeSet[w]) return;
        if (seen[w]) return; // 同じ質問内での重複は1回に
        seen[w] = true;
        freq[w] = (freq[w] || 0) + 1;
        (wordQuestions[w] = wordQuestions[w] || []).push(qIndex);
        if (cat){
          wordCatCount[w] = wordCatCount[w] || {};
          wordCatCount[w][cat] = (wordCatCount[w][cat] || 0) + 1;
        }
      });
    });

    // カテゴリごとの色を、件数順に一度だけ確定させる（キーワード側と表示を揃えるため）
    var palette = ["#2f9e64","#f2a93b","#ef6a52","#7b6ef6","#2fa8c9","#d6486b","#1f7a4d"];
    var catRank = Object.keys(catCount).sort(function(a,b){ return catCount[b]-catCount[a]; });
    var categoryColorMap = {};
    catRank.forEach(function(c, idx){ categoryColorMap[c] = palette[idx % palette.length]; });

    // 自動更新で件数が増えた単語を調べる（増えた順）
    var prevFreq = state.freq;
    state.fxWords = null;
    if (state.highlightNext && prevFreq){
      var up = [];
      Object.keys(freq).forEach(function(w){
        var d = freq[w] - (prevFreq[w] || 0);
        if (d > 0) up.push([w, d]);
      });
      up.sort(function(a,b){ return b[1]-a[1]; });
      state.fxWords = up.map(function(x){ return x[0]; });
    }
    state.highlightNext = false;

    state.questions = questions;
    state.freq = freq;
    state.wordQuestions = wordQuestions;
    state.catCount = catCount;
    state.wordCatCount = wordCatCount;
    state.categoryColorMap = categoryColorMap;
    state.aggregated = true;

    renderWordCloud(freq);
    renderCategoryList(catCount);
    renderQuestionList(null);
    // 自動更新で再集計されたときも、開いているポップアップは最新の質問に更新する
    if (state.popupWord){ openKeywordPopup(state.popupWord); }

    els.resultSection.style.display = "block";
    els.listSection.style.display = "block";
    els.pbCount.textContent = "質問 " + questions.length + "件";
    showStatus(questions.length + " 件の質問を集計しました" + extractModeLabel() + "。", "ok");
  }
  els.aggregateBtn.addEventListener("click", runAggregate);

  // ---------- ワードクラウド描画 ----------
  function renderWordCloud(freq){
    var inPresentation = document.body.classList.contains("presentation");
    var list = Object.keys(freq).map(function(w){ return [w, freq[w]]; });
    list.sort(function(a,b){ return b[1]-a[1]; });
    // 投影モードは画面が広いので、表示する単語数を増やす
    list = list.slice(0, inPresentation ? 90 : 60);

    // キャンバスの大きさ：通常時は幅いっぱい×420px、投影モードでは画面いっぱい
    var canvas = els.cloudCanvas;
    var panel = canvas.parentElement;
    // 前回のサイズが残っていると親パネルの幅まで押し広げてしまうため、測る前にいったんリセットする
    canvas.style.width = "";
    canvas.style.height = "";
    canvas.width = 1;
    canvas.height = 1;
    var cs = getComputedStyle(panel);
    var padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    var padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    var cw = Math.max(panel.clientWidth - padX, 300);
    var ch = inPresentation ? Math.max(panel.clientHeight - padY, 240) : 420;
    canvas.width = cw;
    canvas.height = ch;
    if (inPresentation){
      canvas.style.width = cw + "px";
      canvas.style.height = ch + "px";
    } else {
      canvas.style.width = "";
      canvas.style.height = "";
    }
    // 画面が大きいほど文字も大きくする（投影モードのみ）
    var scale = inPresentation ? Math.max(1, Math.min(cw / 900, ch / 460)) : 1;

    if (typeof WordCloud.stop === "function"){ WordCloud.stop(); }
    // 自動更新で増えた単語：ぽんと大きくなる動きは1回だけ、光る囲みは次の更新まで残す
    // （リサイズ・辞書の切替などの再描画では、同じ単語に光る囲みだけ付け直す）
    var fxWords = state.fxWords, withPop = true;
    state.fxWords = null;
    if (fxWords){ state.glowWords = fxWords.slice(0, 12); }
    else { fxWords = state.glowWords; withPop = false; }
    var fxToken = state.cloudToken = (state.cloudToken || 0) + 1;
    var fxLayer = getFxLayer(canvas); fxLayer.innerHTML = "";

    if (!list.length){
      var ctx = canvas.getContext("2d");
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "#565f5b";
      ctx.font = "14px sans-serif";
      ctx.fillText("表示できるキーワードがありませんでした。", 16, 30);
      return;
    }

    var maxCount = list[0][1];
    var hasCategoryColors = state.categoryColorMap && Object.keys(state.categoryColorMap).length > 0;

    // 投影モード：単語の数や長さが違っても画面を使い切れるよう、文字サイズの倍率を自動で決める。
    // 語の面積（文字サイズ² × 文字数）の合計が、キャンバス面積の約4割になる倍率を求める。
    var fitScale = scale;
    if (inPresentation){
      var sumArea = 0;
      list.forEach(function(it){ var b = 18 + (it[1] / maxCount) * 60; sumArea += b * b * it[0].length; });
      fitScale = Math.sqrt(0.40 * cw * ch / sumArea);
      // 一番大きな語が、画面の幅・高さの大半を占めてしまわないよう上限をかける
      var topLen = list[0][0].length;
      fitScale = Math.min(fitScale, (0.5 * cw) / (78 * topLen), (0.45 * ch) / 78);
    }

    var gridSz = inPresentation ? Math.max(6, Math.round(7 * scale)) : Math.round(canvas.width / 90);
    if (fxWords && fxWords.length){
      canvas.addEventListener("wordcloudstop", function(){
        if (fxToken !== state.cloudToken) return;           // 途中で描き直された場合は何もしない
        setTimeout(function(){ playChangeEffects(canvas, fxWords, gridSz, fxToken, withPop); }, 60);
      }, { once: true });
    }

    WordCloud(canvas, {
      list: list,
      gridSize: gridSz,
      hover: function(item, dim){ if (state.scanning){ state.scanning(item, dim); } },
      weightFactor: function(size){
        var base = inPresentation ? (18 + (size / maxCount) * 60) : (12 + (size / maxCount) * 46);
        return base * fitScale;
      },
      fontFamily: "'Zen Kaku Gothic New', sans-serif",
      shape: inPresentation ? "square" : "circle",
      shrinkToFit: true,
      color: function(word, weight){
        if (hasCategoryColors){
          var c = wordCategoryColor(word);
          if (c) return c;
        }
        // カテゴリ未指定、またはカテゴリに結びつかない語は頻出度の濃淡で表現
        var ratio = weight / maxCount;
        if (ratio > 0.66) return "#1f7a4d";
        if (ratio > 0.33) return "#2f9e64";
        return "#8fc7a4";
      },
      backgroundColor: "#ffffff",
      rotateRatio: 0,
      click: function(item){
        renderQuestionList({ type:"word", value:item[0] });
        openKeywordPopup(item[0]);
      }
    });
  }

  // ---------- 追加された質問の演出 ----------
  function getFxLayer(canvas){
    var panel = canvas.parentElement;
    var layer = panel.querySelector(".fx-layer");
    if (!layer){ layer = document.createElement("div"); layer.className = "fx-layer"; panel.appendChild(layer); }
    layer.style.left = canvas.offsetLeft + "px";
    layer.style.top = canvas.offsetTop + "px";
    return layer;
  }

  // 描き終えたワードクラウド上で、指定した単語の位置を探し、光らせて大きく見せる
  function playChangeEffects(canvas, words, gridSz, token, withPop){
    if (token !== state.cloudToken) return;
    var want = Object.create(null), remaining = 0;
    words.slice(0, 12).forEach(function(w){ if (!want[w]){ want[w] = true; remaining++; } });
    var found = Object.create(null);
    var rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    var kx = rect.width / canvas.width, ky = rect.height / canvas.height;

    // 描画ライブラリは「マウスが乗った位置にある単語」を教えてくれるので、全体をなぞって各単語の範囲を集める
    state.scanning = function(item, dim){
      if (!item || !dim) return;
      var w = item[0];
      if (want[w] && !found[w]){ found[w] = dim; remaining--; }
    };
    try {
      for (var y = gridSz / 2; y < canvas.height && remaining > 0; y += gridSz){
        for (var x = gridSz / 2; x < canvas.width && remaining > 0; x += gridSz){
          canvas.dispatchEvent(new MouseEvent("mousemove", { clientX: rect.left + x * kx, clientY: rect.top + y * ky }));
        }
      }
    } finally { state.scanning = null; }

    var layer = getFxLayer(canvas);
    Object.keys(found).forEach(function(w){
      var d = found[w];
      var left = d.x * kx, top = d.y * ky, width = d.w * kx, height = d.h * ky;

      if (withPop){
      var pop = document.createElement("canvas");            // 単語部分の写し：ぽんと大きくなって元に戻る
      pop.width = Math.max(1, Math.round(d.w)); pop.height = Math.max(1, Math.round(d.h));
      pop.className = "fx-pop";
      pop.style.cssText = "left:" + left + "px;top:" + top + "px;width:" + width + "px;height:" + height + "px;";
      try { pop.getContext("2d").drawImage(canvas, d.x, d.y, d.w, d.h, 0, 0, pop.width, pop.height); } catch (e){}
      pop.addEventListener("animationend", function(){ pop.remove(); });
      layer.appendChild(pop);
      }

      var hl = document.createElement("div");                // 光る囲み
      hl.className = "fx-hl";
      hl.style.cssText = "left:" + (left - 6) + "px;top:" + (top - 4) + "px;width:" + (width + 12) + "px;height:" + (height + 8) + "px;";
      layer.appendChild(hl);
    });
  }

  // 単語に最も多く紐づくカテゴリの色（単語の色・ポップアップの色に使う）
  function wordCategoryColor(word){
    var byCat = state.wordCatCount ? state.wordCatCount[word] : null;
    if (!byCat || !state.categoryColorMap) return null;
    var best = null, bestCount = 0;
    Object.keys(byCat).forEach(function(c){
      if (byCat[c] > bestCount){ best = c; bestCount = byCat[c]; }
    });
    return best ? state.categoryColorMap[best] : null;
  }

  // ---------- キーワードのポップアップ ----------
  function openKeywordPopup(word){
    var items = questionsForWord(word);
    if (!items.length){ closeKeywordPopup(); return; }
    state.popupWord = word;

    var color = wordCategoryColor(word) || "#2f9e64";
    els.kwCard.style.borderTopColor = color;
    els.kwCard.style.setProperty("--kw-color", color);
    els.kwTitle.innerHTML = '「<span class="kw-word">' + escapeHtml(word) + '</span>」を含む質問' +
                            '<span class="kw-count">' + items.length + '件</span>';

    var w = escapeHtml(word);
    els.kwBody.innerHTML = items.map(function(q){
      var text = escapeHtml(q.question).split(w).join("<mark>" + w + "</mark>");
      var meta = q.category ? '<div class="qmeta">' + escapeHtml(q.category) + '</div>' : "";
      return '<div class="kw-item">' + meta + text + '</div>';
    }).join("");

    // 投影モード：件数が多いときは段組み（2〜3列）にして、文字を大きく保ったままスクロールなしで収める
    var presentation = document.body.classList.contains("presentation");
    var n = items.length;
    var cols = presentation ? (n <= 6 ? 1 : n <= 14 ? 2 : 3) : 1;
    els.kwCard.style.width = cols > 1 ? "min(1700px,96vw)" : "";
    els.kwBody.style.columnCount = cols > 1 ? String(cols) : "";

    // 文字サイズ：1列あたりの行数が少ないほど大きく
    var fs = 17;
    if (presentation){
      var vw = window.innerWidth / 100;
      var rows = Math.ceil(n / cols);
      var ratio = rows <= 3 ? 2.6 : rows <= 5 ? 2.2 : rows <= 7 ? 1.8 : rows <= 9 ? 1.5 : 1.25;
      fs = Math.max(18, Math.round(ratio * vw));
    }
    els.kwCard.style.setProperty("--kw-fs", fs + "px");
    els.kwModal.classList.add("show");

    // それでもはみ出す場合は、収まるまで文字を小さくする
    var minFs = presentation ? 14 : 16;
    var guard = 0;
    function overflowing(){
      return els.kwBody.scrollHeight > els.kwBody.clientHeight + 1 ||
             els.kwBody.scrollWidth > els.kwBody.clientWidth + 1;
    }
    while (overflowing() && fs > minFs && guard++ < 40){
      fs -= 2;
      els.kwCard.style.setProperty("--kw-fs", fs + "px");
    }
    els.kwBody.scrollTop = 0;
  }

  function closeKeywordPopup(){
    els.kwModal.classList.remove("show");
    state.popupWord = null;
  }

  // 画面のどこをクリックしても閉じる（投影中にマウス操作だけで閉じられるように）
  els.kwModal.addEventListener("click", closeKeywordPopup);
  els.kwClose.addEventListener("click", function(e){ e.stopPropagation(); closeKeywordPopup(); });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && els.kwModal.classList.contains("show")){ closeKeywordPopup(); }
  });

  // ---------- カテゴリ一覧描画 ----------
  function renderCategoryList(catCount){
    var entries = Object.keys(catCount).map(function(k){ return [k, catCount[k]]; });
    entries.sort(function(a,b){ return b[1]-a[1]; });
    els.catList.innerHTML = "";
    if (!entries.length){
      els.catList.innerHTML = '<li class="empty-note">カテゴリ列が未指定です</li>';
      return;
    }
    var max = entries[0][1];
    var colorMap = state.categoryColorMap || {};
    entries.forEach(function(e){
      var li = document.createElement("li");
      var pct = Math.round((e[1]/max)*100);
      var color = colorMap[e[0]] || "#2f9e64";
      li.innerHTML =
        '<button class="cat-btn" data-cat="'+encodeURIComponent(e[0])+'">' +
          '<div class="cat-top"><span>'+escapeHtml(e[0])+'</span><span class="cat-count">'+e[1]+'</span></div>' +
          '<div class="cat-bar-bg"><div class="cat-bar-fg" style="width:'+pct+'%;background:'+color+'"></div></div>' +
        '</button>';
      els.catList.appendChild(li);
    });
    els.catList.querySelectorAll(".cat-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        renderQuestionList({ type:"category", value: decodeURIComponent(btn.getAttribute("data-cat")) });
      });
    });
  }

  // ---------- 質問一覧描画 ----------
  function renderQuestionList(filter){
    var items = state.questions || [];
    var tag = "全件（" + items.length + "件）";
    if (filter){
      if (filter.type === "word"){
        items = questionsForWord(filter.value);
        tag = "キーワード「" + filter.value + "」（" + items.length + "件）";
      } else if (filter.type === "category"){
        items = items.filter(function(q){ return q.category === filter.value; });
        tag = "カテゴリ「" + filter.value + "」（" + items.length + "件）";
      }
    }
    els.filterTag.textContent = tag;
    els.qListBody.innerHTML = "";
    if (!items.length){
      els.qListBody.innerHTML = '<div class="empty-note">該当する質問がありません。</div>';
      return;
    }
    items.forEach(function(q){
      var div = document.createElement("div");
      div.className = "qitem";
      var meta = q.category ? escapeHtml(q.category) : "";
      div.innerHTML = (meta ? '<div class="qmeta">' + meta + '</div>' : "") + escapeHtml(q.question);
      els.qListBody.appendChild(div);
    });
  }

  els.clearFilterBtn.addEventListener("click", function(){ renderQuestionList(null); });

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  window.addEventListener("resize", function(){
    if (state.freq) renderWordCloud(state.freq);
  });

  // ---------- 投影モード（会場プロジェクタ表示用） ----------
  var presentationOn = false;
  function setPresentation(on){
    presentationOn = on;
    document.body.classList.toggle("presentation", on);
    els.presentModeBtn.textContent = on ? "編集画面に戻る" : "投影モードで表示";
    // レイアウト変更後にキャンバス幅を再計算
    setTimeout(function(){ if (state.freq) renderWordCloud(state.freq); }, 150);
  }
  // 全画面表示（Safari の古い版は webkit 付きの名前、戻り値も Promise とは限らないため吸収する）
  function fsElement(){ return document.fullscreenElement || document.webkitFullscreenElement || null; }
  function enterFullscreen(){
    try {
      var el = document.documentElement;
      var fn = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!fn) return;
      var r = fn.call(el);
      if (r && r.catch){ r.catch(function(){}); }
    } catch (e){ /* 全画面にできなくても投影モード自体は使える */ }
  }
  function exitFullscreen(){
    try {
      var fn = document.exitFullscreen || document.webkitExitFullscreen;
      if (!fn || !fsElement()) return;
      var r = fn.call(document);
      if (r && r.catch){ r.catch(function(){}); }
    } catch (e){}
  }
  els.presentModeBtn.addEventListener("click", function(){
    var goingOn = !presentationOn;
    setPresentation(goingOn);
    if (goingOn){ enterFullscreen(); } else { exitFullscreen(); }
  });
  function onFullscreenChange(){
    if (!fsElement() && presentationOn){ setPresentation(false); }
  }
  document.addEventListener("fullscreenchange", onFullscreenChange);
  document.addEventListener("webkitfullscreenchange", onFullscreenChange);

  // ---------- config.json による自動設定読み込み ----------
  // 同じフォルダに config.json を置いておくと、ページを開くだけで
  // CSV読み込み〜列指定〜集計〜自動更新設定までを自動実行する。
  // config.json が無い場合は何もせず、通常の手動操作にフォールバックする。
  // セミナー名・登壇者名（config.json の eventTitle / speaker）を画面と投影モードの上部バーに表示する
  function setEventInfo(title, speaker){
    var parts = [title, speaker].filter(function(x){ return typeof x === "string" && x.trim(); })
                                .map(function(x){ return x.trim(); });
    var text = parts.join("　｜　");
    // 上部バーは講演タイトルと講師を別々のかたまりにして、入りきらないときは講師ごと2行目へ送る（名前の途中で改行しない）
    els.pbEvent.textContent = "";
    parts.forEach(function(x, i){
      var span = document.createElement("span");
      span.className = "pb-part";
      span.textContent = x + (i < parts.length - 1 ? "　｜　" : "");
      els.pbEvent.appendChild(span);
    });
    els.eventLine.textContent = text;
    if (typeof title === "string" && title.trim()){ document.title = title.trim() + "｜コエミル"; }
  }

  function applyConfig(cfg){
    if (cfg){ setEventInfo(cfg.eventTitle, cfg.speaker); }
    // データソース固定モード：lockDataSource が true のとき、URL入力・CSVアップロードを画面から隠し、
    // config.json の csvUrl だけを使う（誤操作で別のデータに切り替わらないようにするための機能）。
    if (cfg && (cfg.lockDataSource === true || cfg.lockDataSource === "true")){
      state.sourceLocked = true;
      document.body.classList.add("source-locked");
    }

    if (!cfg || !cfg.csvUrl){
      if (state.sourceLocked){
        // 固定モードで csvUrl が無いと何も操作できなくなるため、原因をはっきり表示する
        showStatus("データソースが固定されていますが、config.json に csvUrl が設定されていません。config.json を確認してください。", "error");
      }
      return;
    }
    els.csvUrl.value = cfg.csvUrl;
    if (typeof cfg.excludeWords === "string"){ els.excludeWords.value = cfg.excludeWords; }

    loadFromUrl(cfg.csvUrl).then(function(){
      // 最初の集計は、辞書の読み込みを待ってから行う（表示されたあとに単語が入れ替わらないようにするため）。
      // 3秒待っても読み込めない場合は簡易抽出で先に表示し、読み込み完了後に自動で切り替える。
      // 辞書は待たない：簡易抽出で先に表示し、辞書の準備ができたら自動で切り替える
    }).then(function(){
      if (cfg.questionColumn && state.headers.indexOf(cfg.questionColumn) !== -1){
        els.qCol.value = cfg.questionColumn;
      }
      if (cfg.categoryColumn && state.headers.indexOf(cfg.categoryColumn) !== -1){
        els.catCol.value = cfg.categoryColumn;
      } else if (!cfg.categoryColumn) {
        els.catCol.value = "";
      }
      runAggregate();

      if (cfg.refreshIntervalMs){
        var opt = els.refreshInterval.querySelector('option[value="'+cfg.refreshIntervalMs+'"]');
        if (opt){ els.refreshInterval.value = String(cfg.refreshIntervalMs); }
      }
      if (cfg.autoRefresh){
        els.autoRefresh.checked = true;
        els.autoRefresh.dispatchEvent(new Event("change"));
      }
    }).catch(function(){ /* エラー表示は loadFromUrl 内で行い済み */ });
  }

    fetch("config.json", { cache: "no-store" })
    .then(function(res){
      if (!res.ok) return null;   // config.json が無い → 通常の手動モード
      return res.json().catch(function(){
        // ファイルはあるが書き方が誤っている場合は、気づけるように表示する
        showStatus("config.json の形式が正しくありません。JSONの書き方（カンマや引用符など）を確認してください。", "error");
        return null;
      });
    })
    .catch(function(){ return null; })
    .then(function(cfg){
      // morphology:true のときだけ辞書を読み込む（初期設定は簡易抽出のみ）
      if (!(cfg && (cfg.morphology === true || cfg.morphology === "true"))){
        state.tokenizerStatus = "off";
        tokenizerReady = Promise.resolve();
      } else {
        // 初期表示を優先し、辞書の読み込みは少し遅らせて開始する
        setTimeout(initTokenizer, 1500);
      }
      applyConfig(cfg);
    });

})();
</script>
</body>
