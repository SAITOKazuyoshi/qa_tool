# コエミル サーバ版（Apache 2.4 + mod_php）の設定例
# 置き場所の例: /usr/local/etc/apache24/Includes/koemiru.conf
# パスやホスト名は環境に合わせて変えてください。

# ---- (A) お試し：今あるサイトの下に置く（例: https://skr.0228.me/koemiru/）----
# 既存の <VirtualHost *:443>（skr.0228.me）の中に、次の行を追加します。
#
#   Alias /koemiru /usr/local/www/koemiru
#   Include etc/apache24/koemiru-common.conf
#
# ---- (B) 本番：koemiru.228.jp 専用にする ----
# DNS を GitHub Pages からこのサーバに向け直したあと、certbot --apache で証明書を取ります。
#
# <VirtualHost *:443>
#     ServerName koemiru.228.jp
#     DocumentRoot "/usr/local/www/koemiru"
#     Include etc/apache24/koemiru-common.conf
#     # SSLEngine / SSLCertificateFile などは certbot が追加します
# </VirtualHost>

# ===== ここから下を etc/apache24/koemiru-common.conf として保存 =====

# 設定ファイル（CSV の URL など）とデータ置き場。どちらも公開フォルダの外
SetEnv KOEMIRU_CONFIG /usr/local/etc/koemiru/config.json
SetEnv KOEMIRU_DATA   /var/db/koemiru

<Directory "/usr/local/www/koemiru">
    Options -Indexes
    AllowOverride None

    # 投影画面・管理画面はパスワード付き（参加者は Google フォームから送るので、ここは開かない）
    AuthType Basic
    AuthName "koemiru"
    AuthUserFile "/usr/local/etc/apache24/koemiru.htpasswd"
    Require valid-user

    # GitHub Pages 用の config.json（CSV の URL が入っている）と、説明ファイル類は配らない
    <FilesMatch "^(config\.json|CLAUDE\.md|README\.md|CNAME)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^lib\.php$">
        Require all denied
    </FilesMatch>
</Directory>

# git の管理情報・サーバ用の資料は配らない
<DirectoryMatch "^/usr/local/www/koemiru/(\.git|\.github|server)(/|$)">
    Require all denied
</DirectoryMatch>

# 検索よけ・安全のためのヘッダー
<IfModule mod_headers.c>
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
</IfModule>
